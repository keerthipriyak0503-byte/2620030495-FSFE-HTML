    <title>
        Registration PAGE
    </title>
    <body>
        <align="center">
        <hi>Registration Form</h1>
            <form>
                Name:<input type="text" name="g1" placeholder ="Enter your name">

                Mobile:<input type="tel" name="g3" placeholder="mobile no" pattern=""[0-9]{10}" required><br><br>

                Address: <textarea name="g6" required rows="3" cols="30" placeholder="Enter your address"></textarea><br><br>

                <input type="checkbox" name="g7" value="CSS">CSS
                <input type="checkbox" name="g7" value="JavaScript">JavaScript<br><br>
                Inter Percentage: <input type="number" name="g8" placeholder="Enter your percentage" required>
            </form>
        </body>
