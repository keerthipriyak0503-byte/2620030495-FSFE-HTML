
<!DOCTYPE html>
<html>

<head>
    <title>Employee Registration Form</title>
</head>

<body bgcolor="lightblue">
    <center>
        <h2>Employee Registration Form</h2>
        <form>
            <table align="center" cellpadding="8">
                <tr>
                    <td>Employee Name:</td>
                    <td><input type="text" placeholder="Enter your name"> </td>
                </tr>
                <tr>
                    <td>Password:</td>
                    <td><input type="password" placeholder="Enter your password"></td>
                </tr>
                <tr>
                    <td>Email:</td>
                    <td><input type="email" placeholder="Enter your email"></td>
                </tr>
                <tr>
                    <td>Mobile Number:</td>
                    <td><input type="number" placeholder="Enter your mobile number"></td>
                </tr>
                <tr>
                    <td>Age:</td>
                    <td><input type="number" placeholder="Enter your age"></td>
                </tr>
                <tr>
                    <td>Date of Birth:</td>
                    <td><input type="date" placeholder="Enter your date of birth"></td>
                </tr>
                <tr>
                    <td>Preferred Interview Time:</td>
                    <td><input type="time" placeholder="Enter your preferred interview time"></td>
                </tr>
                <tr>
                    <td>Gender:</td>
                    <td>
                        <input type="radio" name="gender" placeholder="Select gender"> Male
                        <input type="radio" name="gender" placeholder="Select gender"> Female
                    </td>
                </tr>
                <tr>
                    <td>Skills:</td>
                    <td>
                        <input type="checkbox" placeholder="Select skills"> HTML
                        <input type="checkbox" placeholder="Select skills"> CSS
                        <input type="checkbox" placeholder="Select skills"> Java
                        <input type="checkbox" placeholder="Select skills"> JavaScript
                    </td>
                </tr>
                <tr>
                    <td>Select Department:</td>
                    <td>
                        <select>
                            <option>Select Department</option>
                            <option>HR</option>
                            <option>IT</option>
                            <option>Finance</option>
                            <option>Marketing</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Upload Resume:</td>
                    <td><input type="file"></td>
                </tr>
                <tr>
                    <td>Address:</td>
                    <td>
                        <textarea rows="4" cols="30"></textarea>
                    </td>
                </tr>
                <tr>
                    <td>Work Experience:</td>
                    <td>
                        <input type="range" min="0" max="20" value="0">
                    </td>
                </tr>
                <tr>
                    <td>LinkedIn Profile:</td>
                    <td><input type="url"></td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="Register">
                        <input type="reset" value="Clear">
                    </td>
                </tr>
            </table>
        </form>
    </center>
</body>
</html>
